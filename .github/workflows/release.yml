# Baut die Auslieferungsdateien, sobald ein Tag v* geschoben wird.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Gebaut wird immer AUF dem Zielsystem — WiX (.msi) läuft nur auf Windows,
# ein .dmg nur auf macOS. Deshalb drei Runner und keine Kreuzübersetzung.
#
# Das Ergebnis ist ein RELEASE-ENTWURF. Veröffentlicht wird von Hand, nach
# einem Blick auf die Dateien. Zum Signieren siehe docs/RELEASE.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            args: "--target universal-apple-darwin"
          # Älteste unterstützte glibc: ein Binary von einer neueren
          # Distribution startet auf einer älteren nicht.
          - os: ubuntu-22.04
            args: ""
          - os: windows-2022
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Systembibliotheken (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      # Die Ziele stehen nicht in rust-toolchain.toml — sonst lüde jeder
      # Linux- und Windows-Rechner zwei Apple-Bibliotheken herunter.
      - name: Apple-Ziele (macOS)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ohne Finder-Zugriff hängt bundle_dmg.sh beim Gestalten des
          # Fensters. Auf Runnern ist CI ohnehin gesetzt; hier steht es
          # noch einmal, damit der Grund dokumentiert ist.
          CI: true
        with:
          tauriScript: npm run tauri --
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true

      # Die Kommandozeile kommt nicht ins Desktop-Bündel (Tauri verlangte
      # dafür einen „Sidecar" mit Zielplattform im Namen) — deshalb daneben
      # als eigener Tarball, je System einer.
      - run: node scripts/package-cli.mjs
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: dist/*.tar.gz
